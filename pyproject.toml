[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "smplkit-sdk"
dynamic = ["version"]
description = "Official Python SDK for the smplkit platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "attrs>=21.3.0",
    "python-dateutil>=2.9.0",
    "websockets>=13.0",
    "json-logic-qubit>=0.9.1",
]

[project.urls]
Homepage = "https://www.smplkit.com"
Documentation = "https://docs.smplkit.com"
Repository = "https://github.com/smplkit/python-sdk"

[project.entry-points."smplkit.logging.adapters"]
stdlib = "smplkit.logging.adapters.stdlib_logging:StdlibLoggingAdapter"
loguru = "smplkit.logging.adapters.loguru_adapter:LoguruAdapter"

[project.optional-dependencies]
loguru = ["loguru>=0.7.0"]
dev = [
    # Pinned <0.29.0: 0.29.0 dropped python-dateutil for datetime.fromisoformat
    # in generated code, which cannot parse trailing-'Z' UTC timestamps on
    # Python 3.10 (our declared floor). Revisit if/when we drop 3.10 support.
    "openapi-python-client>=0.21.0,<0.29.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.0",
    "loguru>=0.7.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/smplkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/smplkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test against the source tree so the package does not need to be
# (editable-)installed in the dev venv. Mirrors python-core.
pythonpath = ["src"]

[tool.coverage.run]
omit = ["src/smplkit/_generated/*", "src/smplkit/_version.py"]

[tool.coverage.report]
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
extend-exclude = ["src/smplkit/_generated", "src/smplkit/_version.py"]

[tool.ruff.lint]
# Explicit rule selection so the enforced set is independent of ruff's
# shifting defaults (ruff 0.16.0 broadened the default set and turned a
# clean tree red overnight — an explicit select insulates us from that).
# Curated modern set: pyflakes, import sorting, pyupgrade, simplify,
# ruff-specific, comprehensions, perf. The ignores drop rules that are
# noisy on idiomatic code or stylistic-with-a-large-manual-tail:
# The ignores drop rules that have no autofix and need a judgment-laden
# manual refactor (behavior/readability risk), or that are pure noise on
# idiomatic code — so the enforced set is what `ruff --fix` resolves
# mechanically, no hand-rewrites of working code:
#   SIM102/105/116/117  combine-if / suppress / dict-lookup / combine-with
#   PERF203/401/402/403  try/except-in-loop + loop->comprehension rewrites
#   RUF001-003  ambiguous unicode in strings/docstrings/comments (content)
#   RUF012   mutable class defaults -> ClassVar (manual, low value here)
#   RUF043   unescaped metachars in pytest `match=` (test-only pedantry)
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "RUF", "C4", "PERF"]
ignore = [
  "SIM102", "SIM105", "SIM116", "SIM117",
  "RUF001", "RUF002", "RUF003", "RUF012", "RUF043",
  "PERF203", "PERF401", "PERF402", "PERF403",
]
